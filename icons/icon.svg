<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a71d2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="58" fill="url(#gradient)" stroke="#fff" stroke-width="4"/>
  
  <!-- Record button -->
  <circle cx="64" cy="64" r="20" fill="#fff"/>
  
  <!-- Play arrow -->
  <polygon points="58,54 58,74 78,64" fill="url(#gradient)"/>
  
  <!-- Small dots around the circle to indicate recording -->
  <circle cx="64" cy="20" r="3" fill="#fff"/>
  <circle cx="94" cy="34" r="3" fill="#fff"/>
  <circle cx="108" cy="64" r="3" fill="#fff"/>
  <circle cx="94" cy="94" r="3" fill="#fff"/>
  <circle cx="64" cy="108" r="3" fill="#fff"/>
  <circle cx="34" cy="94" r="3" fill="#fff"/>
  <circle cx="20" cy="64" r="3" fill="#fff"/>
  <circle cx="34" cy="34" r="3" fill="#fff"/>
</svg>