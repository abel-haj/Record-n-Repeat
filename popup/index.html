<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Record-n-Repeat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Record-n-Repeat</h1>
        <p class="subtitle">Record and replay user actions</p>
      </div>

      <div class="controls">
        <div class="loading-state" id="loadingState">
          <div class="loading-spinner"></div>
          <span>Loading...</span>
        </div>

        <div class="status-section">
          <!-- <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Ready</span>
          </div> -->
        </div>

        <div class="button-group">
          <button id="recordBtn" class="btn btn-record">
            <span class="btn-icon">●</span>
            Start Recording
          </button>
          <button id="stopBtn" class="btn btn-stop" disabled>
            <span class="btn-icon">■</span>
            Stop Recording
          </button>
          <button id="playBtn" class="btn btn-play" disabled>
            <span class="btn-icon">▶</span>
            Replay Actions
          </button>
        </div>

        <div class="actions-section">
          <div class="section-header">
            <h3>Recorded Actions</h3>
            <span id="actionCount" class="count">0</span>
          </div>
          <div id="actionsList" class="actions-list">
            <p class="empty-state">No actions recorded yet</p>
          </div>
        </div>

        <div class="button-group">
          <button id="clearBtn" class="btn btn-secondary">
            Clear All
          </button>
          <button id="testBtn" class="btn btn-secondary">
            Test It
          </button>
        </div>

        <div class="tabs-info-section" style="display: none">
          <h3>Current Tabs</h3>
          <div class="table-responsive">
            <table class="tabs-table">
              <thead>
                <tr>
                  <!-- <th>Type</th> -->
                  <th>Status</th>
                  <th>Tab ID</th>
                  <th>Title</th>
                  <th>URL</th>
                </tr>
              </thead>
              <tbody id="tabsTableBody">
                <!-- Tab info will be dynamically inserted here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
